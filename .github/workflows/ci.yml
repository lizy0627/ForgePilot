name: CI

on:
  pull_request:
  push:
    branches: [develop, main, 'release/**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}\agent.venv
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pinned uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.12.15

      - name: Create locked isolated agent environment
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath scripts/local-env.cmd) { throw 'CI must not read personal local-env.cmd' }
          if (Test-Path -LiteralPath agent/.venv) { throw 'Unexpected agent/.venv in clean checkout' }
          $python = (Get-Command python.exe -CommandType Application).Source
          Push-Location agent
          try { uv sync --locked --python $python } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Locked agent setup failed' }
          if (-not (Test-Path -LiteralPath agent.venv/Scripts/python.exe)) { throw 'Root agent.venv is missing' }

      - name: Python lint and static checks
        shell: pwsh
        run: |
          & ./agent.venv/Scripts/python.exe -m compileall -q agent scripts eval
          if ($LASTEXITCODE -ne 0) { throw 'Python compileall failed' }
          & ./agent.venv/Scripts/ruff.exe check --target-version py312 --select E9,F63,F7,F82 agent/forgepilot agent/tests scripts eval
          if ($LASTEXITCODE -ne 0) { throw 'Ruff static check failed' }

      - name: Python tests / PR fast set
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/ci-python-tests.ps1 -Fast

      - name: Offline retrieval evaluation / develop, main and release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          foreach ($name in @(
            'FORGEPILOT_API_KEY','FORGEPILOT_BASE_URL','FORGEPILOT_MODEL_CONFIG',
            'FORGEPILOT_MCP_CONFIG','FORGEPILOT_QDRANT_URL',
            'FORGEPILOT_EMBEDDING_API_KEY','FORGEPILOT_EMBEDDING_BASE_URL',
            'FORGEPILOT_LOCAL_API_TOKEN','OPENAI_API_KEY','ANTHROPIC_API_KEY',
            'AZURE_OPENAI_API_KEY','GOOGLE_API_KEY','QDRANT_API_KEY','TAVILY_API_KEY'
          )) { Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue }
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          & ./agent.venv/Scripts/python.exe ./eval/run_retrieval.py --mode all --repository . --json-out ./artifacts/retrieval-eval.json --markdown-out ./artifacts/retrieval-eval.md
          if ($LASTEXITCODE -ne 0) { throw 'Offline retrieval evaluation failed' }

      - name: Protocol and OpenAPI drift
        shell: pwsh
        run: |
          Push-Location agent
          try { & ../agent.venv/Scripts/python.exe -m forgepilot.export_protocol } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Protocol export failed' }
          git diff --exit-code -- protocol
          if ($LASTEXITCODE -ne 0) { throw 'Protocol or OpenAPI drift detected' }

      - name: Install Qt 6.8.3 MSVC x64
        uses: jurplel/install-qt-action@12aa0336e1e410b3c6dff5e0722547f7a37e8c60 # v4.2.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Qt configure
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:QT_ROOT_DIR/bin/windeployqt.exe")) { throw 'Qt MSVC kit is missing' }
          "FORGEPILOT_QT_KIT=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:FORGEPILOT_QT_KIT = $env:QT_ROOT_DIR
          Push-Location client
          try { cmake --preset msvc2022-x64 } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Qt configure failed' }

      - name: Qt build
        shell: pwsh
        run: |
          Push-Location client
          try { cmake --build --preset release --parallel 4 } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Qt build failed' }

      - name: Qt tests / PR fast set
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ctest --test-dir client/build -C Release --output-on-failure -R '^client_(mission_api|mission_sse|workbench_models|mission_controller|workbench_qml)$'
          if ($LASTEXITCODE -ne 0) { throw 'Qt fast tests failed' }
          # Keep the full communication suite in full checks; run its RAG regressions on PRs.
          & ./client/build/Release/ForgePilotClientTests.exe protocolAcceptsAllPublicEvents controllerRagUsageDoesNotInterruptTaskStream -o client/build/rag-events-results.txt,txt
          Get-Content client/build/rag-events-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'Qt RAG event regressions failed' }

      - name: Qt tests / develop, main and release full set
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ctest --test-dir client/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Qt full tests failed' }

      - name: Qt offline HTTP and QML integration / develop, main and release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/ci-qt-integration.ps1

      - name: Deploy client runtime
        shell: pwsh
        run: |
          Push-Location client
          try { & "$env:FORGEPILOT_QT_KIT/bin/windeployqt.exe" --release --no-translations --qmldir . build/Release/ForgePilotClient.exe } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Qt runtime deployment failed' }

      - name: Python tests / develop, main and release full set
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/ci-python-tests.ps1 -Full

      - name: Package smoke / PR fast set
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          & ./scripts/Package-Windows.ps1 -Version ci-pr -OutputDirectory ./artifacts
          if ($LASTEXITCODE -ne 0) { throw 'PR package creation failed' }
          & ./agent.venv/Scripts/python.exe -I ./scripts/release_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline backend smoke failed' }

      - name: Package smoke / develop, main and release full set
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          & ./scripts/Package-Windows.ps1 -Version ci-full -OutputDirectory ./artifacts -Verify
          if ($LASTEXITCODE -ne 0) { throw 'Extracted package verification failed' }
