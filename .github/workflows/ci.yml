name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-agent:
    name: Windows / Python and protocol
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pinned uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.12.15

      - name: Install agent from lock file
        shell: cmd
        run: scripts\Setup-Agent.cmd

      - name: Verify environment location and lock file
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'agent.venv\Scripts\python.exe' -PathType Leaf)) {
            throw 'Root agent.venv was not created.'
          }
          if (Test-Path -LiteralPath 'agent\.venv') {
            throw 'Unsupported agent/.venv was created.'
          }
          Push-Location agent
          try { uv lock --check } finally { Pop-Location }
          git diff --exit-code -- agent/uv.lock

      - name: Compile agent sources
        shell: cmd
        run: agent.venv\Scripts\python.exe -m compileall -q agent

      - name: Run offline core agent tests
        shell: pwsh
        run: |
          & .\agent.venv\Scripts\python.exe -m pytest -q `
            -k 'not test_stop_cancels_startup_before_window_and_waits_for_both_workers and not test_mcp_budget_survives_real_build_failure_and_repair' `
            agent/tests/test_environment.py `
            agent/tests/test_security.py `
            agent/tests/test_llm.py `
            agent/tests/test_api.py `
            agent/tests/test_conversations.py `
            agent/tests/test_desktop_launcher.py `
            agent/tests/test_mcp.py `
            agent/tests/test_mcp_api.py `
            agent/tests/test_mcp_generic.py `
            agent/tests/test_mcp_http.py `
            agent/tests/test_mcp_runtime.py `
            agent/tests/test_mcp_service.py

      - name: Export and verify protocol contracts
        shell: pwsh
        run: |
          Push-Location agent
          try { & ..\agent.venv\Scripts\python.exe -m forgepilot.export_protocol } finally { Pop-Location }
          git diff --exit-code -- protocol
